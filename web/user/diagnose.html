<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 诊断</title>
<style>
body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
input, button { padding: 10px; margin: 6px 0; font-size: 16px; width: 100%; box-sizing: border-box; }
.result { background: #f5f5f5; padding: 12px; border-radius: 8px; margin: 12px 0; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
.success { border-left: 4px solid #4caf50; }
.error { border-left: 4px solid #f44336; }
h2 { color: #333; }
.btn-group { display: flex; gap: 8px; }
.btn-group button { flex: 1; }
</style>
</head>
<body>
<h1>🔍 棒棒券 API 诊断</h1>

<h2>注册</h2>
<input id="regUser" placeholder="用户名" value="test_diag">
<input id="regPass" type="password" placeholder="密码" value="test123">
<button onclick="doRegister()">注册</button>
<div id="regResult"></div>

<h2>登录</h2>
<input id="loginUser" placeholder="用户名" value="test_diag">
<input id="loginPass" type="password" placeholder="密码" value="test123">
<button onclick="doLogin()">登录</button>
<div id="loginResult"></div>

<h2>检查登录状态</h2>
<button onclick="checkMe()">GET /api/user/me（需要登录后执行）</button>
<div id="meResult"></div>

<h2>用户列表</h2>
<button onclick="listUsers()">查看所有用户</button>
<div id="usersResult"></div>

<script>
const BASE = '';
let savedToken = '';

async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value.trim();
  const el = document.getElementById('regResult');
  try {
    const r = await fetch(BASE + '/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await r.json();
    if (data.access_token) {
      savedToken = data.access_token;
      localStorage.setItem('jwt_token', data.access_token);
      el.innerHTML = '<div class="result success">✅ 注册成功！<br>Token 已保存到 localStorage<br>用户: ' + JSON.stringify(data.user, null, 2) + '</div>';
    } else {
      el.innerHTML = '<div class="result error">❌ ' + JSON.stringify(data, null, 2) + '</div>';
    }
  } catch(e) {
    el.innerHTML = '<div class="result error">❌ 网络错误: ' + e.message + '</div>';
  }
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const el = document.getElementById('loginResult');
  try {
    const r = await fetch(BASE + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await r.json();
    if (data.access_token) {
      savedToken = data.access_token;
      localStorage.setItem('jwt_token', data.access_token);
      el.innerHTML = '<div class="result success">✅ 登录成功！<br>Token 已保存到 localStorage<br>用户: ' + JSON.stringify(data.user, null, 2) + '</div>';
    } else {
      el.innerHTML = '<div class="result error">❌ ' + JSON.stringify(data, null, 2) + '</div>';
    }
  } catch(e) {
    el.innerHTML = '<div class="result error">❌ 网络错误: ' + e.message + '</div>';
  }
}

async function checkMe() {
  const el = document.getElementById('meResult');
  const token = savedToken || localStorage.getItem('jwt_token');
  if (!token) {
    el.innerHTML = '<div class="result error">⚠️ 没有 Token，请先登录或注册</div>';
    return;
  }
  try {
    const r = await fetch(BASE + '/api/user/me', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    const data = await r.json();
    if (data.username) {
      el.innerHTML = '<div class="result success">✅ 已登录！<br>用户: ' + JSON.stringify(data, null, 2) + '</div>';
    } else {
      el.innerHTML = '<div class="result error">❌ ' + JSON.stringify(data, null, 2) + '</div>';
    }
  } catch(e) {
    el.innerHTML = '<div class="result error">❌ 网络错误: ' + e.message + '</div>';
  }
}

async function listUsers() {
  const el = document.getElementById('usersResult');
  try {
    const r = await fetch(BASE + '/api/admin/users');
    const data = await r.json();
    el.innerHTML = '<div class="result success">📋 用户列表 (' + data.length + ' 人):<br>' + JSON.stringify(data, null, 2) + '</div>';
  } catch(e) {
    el.innerHTML = '<div class="result error">❌ 网络错误: ' + e.message + '</div>';
  }
}

// 页面加载时检查 localStorage 中是否有 token
(function() {
  const token = localStorage.getItem('jwt_token');
  if (token) {
    savedToken = token;
    document.getElementById('meResult').innerHTML = '<div class="result">💾 localStorage 中有已保存的 Token (' + token.substring(0, 30) + '...)</div>';
  }
})();
</script>
</body>
</html>
