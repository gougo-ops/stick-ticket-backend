services:
  - type: web
    name: stick-ticket-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # 在 Render Dashboard 手动设置 Supabase 连接串
        value: "postgresql://postgres:YOUR_PASSWORD@YOUR_HOST:6543/postgres?pgbouncer=true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: "24"
